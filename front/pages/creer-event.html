<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="utf-8">

    <title>Créer un événement</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../js/config.js"></script>

</head>

<body>

    <aside>

        <button id="toggle-button" aria-label="Toggle Sidebar">
            <img src="/front/assets/LOGO-pa.png" alt="Logo">
            <href="planning.html">>
            
        </button>

        <ul>

            <li>
                <button class="nav-button">
                    <img src="/front/assets/people-svgrepo-com (1).svg" alt="Formations">
                    <span>Formations</span>
                </button>
            </li>

            <li>
                <button class="nav-button">
                    <img src="/front/assets/party-horn-svgrepo-com.svg" alt="Événement">
                    <a href="event.html">Événement</a>
                </button>
            </li>

            <li>
                <button class="nav-button">
                    <img src="/front/assets/pencil-square-svgrepo-com.svg" alt="Ateliers">
                    <span>Ateliers</span>
                </button>
            </li>

            <li>
                <button class="nav-button">
                    <img src="/front/assets/news-svgrepo-com.svg" alt="Articles">
                    <span>Articles</span>
                </button>
            </li>

        </ul>

        <button id="logout-button">
            <img src="/front/assets/logout-svgrepo-com.svg" alt="Logout">
        </button>

    </aside>


    <main id="main-content">

        <h1>Créer un événement</h1>

        <form id="form-evenement">

            <div class="form-group">

                <label for="titre">Titre</label>

                <input
                    type="text"
                    id="titre"
                    name="titre"
                    required
                >

            </div>


            <div class="form-group">

                <label for="description">Description</label>

                <textarea
                    id="description"
                    name="description"
                ></textarea>

            </div>


            <div class="form-group">

                <label for="date-debut">Date de début</label>

                <input
                    type="datetime-local"
                    id="date-debut"
                    name="date-debut"
                    required
                >

            </div>


            <div class="form-group">

                <label for="date-fin">Date de fin</label>

                <input
                    type="datetime-local"
                    id="date-fin"
                    name="date-fin"
                >

            </div>


            <div class="form-group">

                <label for="lieu">Lieu</label>

                <input
                    type="text"
                    id="lieu"
                    name="lieu"
                >

            </div>


            <div class="form-group">

                <label for="site">Site</label>

                <select id="site" name="site">

                    <option value="">Sélectionner un site</option>
                    <option value="paris-10">Paris 10e</option>
                    <option value="paris-11">Paris 11e</option>
                    <option value="paris-13">Paris 13e</option>
                    <option value="montreuil">Montreuil</option>
                    <option value="suisse">Suisse</option>

                </select>

            </div>


            <div class="form-buttons">

                <button
                    type="submit"
                    name="action"
                    value="brouillon"
                    class="button-draft"
                >
                    Enregistrer en brouillon
                </button>

                <button
                    type="submit"
                    name="action"
                    value="soumettre"
                    class="button-submit"
                >
                    Soumettre à validation
                </button>

            </div>

        </form>


        <div id="confirmation" style="display: none;">

            Événement enregistré !

        </div>

    </main>


    <script src="../js/creer-event.js"></script>

</body>

</html>
