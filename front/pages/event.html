<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="utf-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&display=swap" rel="stylesheet">

    <title>Mes événements</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../js/config.js"></script>

</head>

<body>

    <aside>

        <button id="toggle-button" aria-label="Toggle Sidebar">
            <img src="/front/assets/LOGO-pa.png" alt="Logo">
            <href="planning.html">>
            
        </button>

        <ul>

            <li>
                <button class="nav-button">
                    <img src="/front/assets/people-svgrepo-com (1).svg" alt="Formations">
                    <span>Formations</span>
                </button>
            </li>

            <li>
                <button class="nav-button">
                    <img src="/front/assets/party-horn-svgrepo-com.svg" alt="Événement">
                    <a href="event.html">Événement</a>
                </button>
            </li>

            <li>
                <button class="nav-button">
                    <img src="/front/assets/pencil-square-svgrepo-com.svg" alt="Ateliers">
                    <span>Ateliers</span>
                </button>
            </li>

            <li>
                <button class="nav-button">
                    <img src="/front/assets/news-svgrepo-com.svg" alt="Articles">
                    <span>Articles</span>
                </button>
            </li>

        </ul>

        <button id="logout-button">
            <img src="/front/assets/logout-svgrepo-com.svg" alt="Logout">
        </button>

    </aside>




    <main>

        <div class="page-header">

            <h1>Mes événements</h1>

            <a href="creer-event.html" class="btn-primary">
                + Créer un événement
            </a>

        </div>


        <div class="filtres">

            <button class="pill active" data-statut="tous">
                Tous
            </button>

            <button class="pill" data-statut="brouillon">
                Brouillon
            </button>

            <button class="pill" data-statut="en_attente">
                En attente
            </button>

            <button class="pill" data-statut="publie">
                Publié
            </button>

            <button class="pill" data-statut="annule">
                Annulé
            </button>

            <button class="pill" data-statut="termine">
                Terminé
            </button>

        </div>


        <div class="evenements">

            <div class="evenement-row" data-statut="publie">

                <span class="evenement-titre">
                    Collecte solidaire Fayette
                </span>

                <span class="evenement-date">
                    18 août 2026
                </span>

                <span class="badge-statut statut-publie">
                    Publié
                </span>

                <a href="#" class="btn-modifier">
                    Modifier
                </a>

            </div>

        </div>

    </main>


    <script src="../js/event.js"></script>

</body>

</html>
