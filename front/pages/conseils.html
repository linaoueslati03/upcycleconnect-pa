<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="utf-8">

    <title>Rédiger un conseil</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="front/js/config.js"></script>

</head>

<body>

    <aside>

        <button id="toggle-button" aria-label="Toggle Sidebar">
            <img src="/front/assets/LOGO-pa.png" alt="Logo">
            <href="planning.html">>
            
        </button>

        <ul>

            <li>
                <button class="nav-button">
                    <img src="/front/assets/people-svgrepo-com (1).svg" alt="Formations">
                    <span>Formations</span>
                </button>
            </li>

            <li>
                <button class="nav-button">
                    <img src="/front/assets/party-horn-svgrepo-com.svg" alt="Événement">
                    <a href="event.html">Événement</a>
                </button>
            </li>

            <li>
                <button class="nav-button">
                    <img src="/front/assets/pencil-square-svgrepo-com.svg" alt="Ateliers">
                    <span>Ateliers</span>
                </button>
            </li>

            <li>
                <button class="nav-button">
                    <img src="/front/assets/news-svgrepo-com.svg" alt="Articles">
                    <span>Articles</span>
                </button>
            </li>

        </ul>

        <button id="logout-button">
            <img src="/front/assets/logout-svgrepo-com.svg" alt="Logout">
        </button>

    </aside>


    <main>

        <div class="page-header">

            <h1>Rédiger un conseil</h1>

        </div>


        <form id="form-conseil">

            <label for="titre">
                Titre
            </label>

            <input
                type="text"
                id="titre"
                name="titre"
                required
            >


            <label for="categorie">
                Catégorie
            </label>

            <select id="categorie" name="categorie">

                <option value="materiaux">
                    Matériaux
                </option>

                <option value="techniques">
                    Techniques
                </option>

                <option value="securite">
                    Sécurité
                </option>

            </select>


            <label for="contenu">
                Contenu
            </label>

            <textarea
                id="contenu"
                name="contenu"
                rows="8"
                required
            ></textarea>


            <button
                type="submit"
                name="action"
                value="brouillon"
            >
                Enregistrer en brouillon
            </button>

            <button
                type="submit"
                name="action"
                value="publier"
            >
                Publier
            </button>

        </form>


        <hr class="separateur">

        <h2>
            Mes articles
        </h2>

    </main>


    <script src="front/js/conseils.js"></script>

</body>

</html>
